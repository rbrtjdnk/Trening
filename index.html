<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tréningový denník</title>
<meta name="theme-color" content="#6b7d2a">

<style>
:root{--bg:#f3f3ef;--card:#fff;--ink:#16181d;--mut:#6b7078;--line:#e3e3dd;--acc:#6b7d2a;--soft:#eef1dc;--ok:#1f9d55;--bad:#d93025}
@media (prefers-color-scheme:dark){:root{--bg:#0e1013;--card:#1a1d22;--ink:#f1f2f4;--mut:#9aa0a8;--line:#2b2f36;--acc:#8ea037;--soft:#222a12}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;padding:18px 14px 170px}
h1{font-size:26px;margin:4px 2px 14px;letter-spacing:-.02em}
h2{font-size:17px;margin:20px 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
label:first-child{margin-top:0}
.tx{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none}
.tx:focus{border-color:var(--acc)}
.row2{display:grid;grid-template-columns:1fr 150px;gap:8px}
.btn{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:disabled{opacity:.4}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:11px}
.btn.dng{color:var(--bad)}
.hero .btn{margin-top:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:26px;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--mut)}
.ent{padding:12px}
.eh{display:flex;gap:12px;align-items:center}
.eh .th{width:62px;height:60px;flex:none}
.eh .t{flex:1;min-width:0}
.eh .t b{display:block;line-height:1.25}
.eh .t small{color:var(--mut);font-size:13px}
.x{border:0;background:transparent;font-size:22px;color:var(--mut);width:36px;height:36px;border-radius:10px}
.ctl{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;margin-top:12px}
.sl{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.st{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.st button{border:0;background:transparent;width:42px;height:46px;font-size:22px;color:var(--acc);font-weight:700}
.st input{flex:1;min-width:0;width:100%;border:0;background:transparent;text-align:center;font:inherit;font-size:19px;font-weight:700;color:inherit;outline:none}
.add{width:100%;border:2px dashed var(--line);background:transparent;border-radius:16px;padding:16px;color:var(--acc);font-weight:700}
.hint{color:var(--mut);text-align:center;padding:18px 10px;font-size:15px}
.savebar{position:fixed;left:0;right:0;bottom:66px;padding:10px 14px;background:linear-gradient(transparent,var(--bg) 35%);z-index:5}
.savebar>div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav>div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav button{border:0;background:transparent;padding:9px 0 8px;color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--acc);font-weight:700}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xc{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 10px 11px;display:flex;flex-direction:column}
.xc .th{background:var(--bg);border-radius:11px;height:104px;margin-bottom:8px}
.xc.on{opacity:.55}
.xn{font-weight:600;font-size:14px;line-height:1.25}
.xg{font-size:12px;color:var(--mut);margin-top:2px}
.ck{position:absolute;top:12px;right:14px;background:var(--ok);color:#fff;font-style:normal;width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;font-size:13px}
.th svg,.big svg{width:100%;height:100%;display:block}
.body line{stroke:var(--ink);stroke-width:3.4;stroke-linecap:round}
.head{fill:var(--card);stroke:var(--ink);stroke-width:3}
.pl{fill:var(--acc)}
.ln{stroke:var(--mut);stroke-width:2;stroke-linecap:round}
.bn{fill:var(--mut);opacity:.4}
.gr{stroke:var(--line);stroke-width:1.6}
.fa{animation:fa 2.6s ease-in-out infinite}
.fb{animation:fb 2.6s ease-in-out infinite}
@keyframes fa{0%,32%{opacity:1}50%,82%{opacity:0}100%{opacity:1}}
@keyframes fb{0%,32%{opacity:0}50%,82%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.fa{animation:none}.fb{display:none}}
.hc{padding:14px}
.cal{padding:12px 12px 14px}
.cm{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cm>div{text-align:center}.cm b{display:block;font-size:17px}.cm small{color:var(--mut);font-size:13px}
.cm .x{font-size:28px;color:var(--acc);width:44px;height:44px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cg i{font-style:normal;font-size:12px;color:var(--mut);padding:2px 0 4px}
.cd{aspect-ratio:1;border:0;border-radius:50%;background:transparent;font-size:15px;color:var(--ink);padding:0}
.cd.on{background:var(--acc);color:#fff;font-weight:700}
.cd.two{box-shadow:inset 0 0 0 3px rgba(0,0,0,.28)}
.cd.td{box-shadow:inset 0 0 0 2px var(--ink)}
.cd.on.td{box-shadow:inset 0 0 0 2px var(--card),0 0 0 2px var(--ink)}
.cd.sel{outline:3px solid var(--ink);outline-offset:1px}
.fl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 2px 12px;font-size:14px}
.hh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hh b{font-size:17px}.hh span{color:var(--mut);font-size:13px;white-space:nowrap}
.hl{margin:10px 0 12px;padding:0;list-style:none}
.hl li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.hl li span:last-child{text-align:right}
.hl li small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.acts{display:flex;gap:8px}
.note{color:var(--mut);font-size:12.5px;text-align:center;margin:18px 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.ov.top{align-items:flex-start}
.ov.top .pn{border-radius:0 0 22px 22px;padding-top:calc(16px + env(safe-area-inset-top))}
.pn{background:var(--bg);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 14px calc(22px + env(safe-area-inset-bottom))}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.ph h3{margin:0;font-size:19px}
.big{height:210px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.kv b{display:block;font-size:18px}.kv span{font-size:12px;color:var(--mut)}
.pill{display:inline-block;background:var(--soft);color:var(--acc);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
.chart{width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
.chart text{fill:var(--mut);font-size:9px}
.chart polyline{fill:none;stroke:var(--acc);stroke-width:2.2;stroke-linejoin:round}
.chart circle{fill:var(--acc)}
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
select.tx{appearance:auto}
</style>
</head>

    h+=`</ul><div class="acts"><button class="btn sm" data-a="hedit" data-id="${w.id}">Upraviť</button><button class="btn sm dng" data-a="hdel" data-id="${w.id}">${confirmK==='del:'+w.id?'Naozaj zmazať?':'Zmazať'}</button></div></div>`;
  });
  if(window.STANDALONE)h+=`<div class="card" style="margin-top:14px"><b>Záloha dát</b><div style="color:var(--mut);font-size:13px;margin:4px 0 10px">Dáta sú uložené len v tomto telefóne. Raz za čas si ich ulož do súboru.</div><div class="acts"><button class="btn sm" data-a="export">Stiahnuť zálohu</button><button class="btn sm" data-a="import">Obnoviť zo zálohy</button></div><input type="file" id="imp" accept=".json,application/json" style="display:none"></div>`;
  h+=`<div class="note">${backend==='db'?'Dáta sa ukladajú do tvojho účtu a sú dostupné aj na iných zariadeniach.':'Dáta sa ukladajú len v tomto prehliadači.'}</div>`;
  return h;
}

/* ---------- sheet ---------- */
function chart(pts){
  if(pts.length<2)return '';
  const W=300,H=120,pl=34,pr=12,pt=12,pb=20;
  const ys=pts.map(p=>p.kg);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1}
  const X=i=>pl+(W-pl-pr)*i/(pts.length-1),Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const pl_=pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.kg).toFixed(1)).join(' ');
  const sd=s=>{const a=s.split('-');return +a[2]+'.'+ +a[1]+'.'};
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><text x="2" y="${Y(mx)+3}">${fmtN(mx)}</text><text x="2" y="${Y(mn)+3}">${fmtN(mn)}</text><polyline points="${pl_}"/>${pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.kg).toFixed(1)}" r="3"/>`).join('')}<text x="${pl}" y="${H-4}">${sd(pts[0].date)}</text><text x="${W-pr}" y="${H-4}" text-anchor="end">${sd(pts[pts.length-1].date)}</text></svg>`;
}
function renderSheet(){
  const el=$('#sheet');
  if(!SH){el.innerHTML='';return}
  let body='';
  if(SH.t==='pick'){
    const n=S.draft?S.draft.entries.length:0;
    body=`<div class="ph"><h3>Pridať cvik</h3><button class="btn pri sm" data-a="close">Hotovo${n?' ('+n+')':''}</button></div>${filters()}<div id="gridbox">${grid('pick',true)}</div><button class="add" style="margin-top:12px" data-a="new-open">+ Vlastný cvik</button>`;
  }else if(SH.t==='ex'){
    const x=exById(SH.id);
    if(!x){SH=null;el.innerHTML='';return}
    const hs=hist(x.id);
    const pr=hs.length?Math.max(...hs.map(h=>h.kg)):null;
    const pts=hs.slice(0,12).reverse();
    body=`<div class="ph"><h3>${esc(x.n)}</h3><button class="x" data-a="close" aria-label="Zavrieť">×</button></div>
    <div class="big">${art(x)}</div>
    <div class="kv"><div><b>${pr!==null?fmtN(pr)+' kg':'–'}</b><span>osobný rekord</span></div><div><b>${hs.length}</b><span>tréningov</span></div><div><b>${hs.length?fmtN(hs[0].kg)+' kg':'–'}</b><span>naposledy${hs.length?', '+srs(hs[0].sets)+(hs[0].reps?', '+rps(hs[0].reps):''):''}</span></div></div>
    <p style="margin:0 0 12px"><span class="pill">${esc(x.g)}</span></p>
    ${chart(pts)}
    ${hs.length?'<ul class="hl card" style="padding:4px 14px;margin:0 0 12px">'+hs.slice(0,8).map(h=>`<li><span>${fmtD(h.date)}</span><span>${smh(h.sets,h.kg,h.reps)}</span></li>`).join('')+'</ul>':'<div class="hint">Tento cvik si ešte nezapísal.</div>'}
    <button class="btn pri" data-a="add-from-ex" data-id="${x.id}">Pridať do tréningu</button>
    <button class="btn" style="margin-top:8px" data-a="edit-open" data-id="${x.id}">Upraviť cvik</button>
    ${x.custom?`<button class="btn dng" style="margin-top:8px" data-a="del-ex" data-id="${x.id}">${confirmK==='ex:'+x.id?'Naozaj odstrániť cvik?':'Odstrániť vlastný cvik'}</button>`:''}`;
  }else if(SH.t==='edit'){
    const x=exById(SH.id);
    if(!x){SH=null;el.innerHTML='';return}
    body=`<div class="ph"><h3>Upraviť cvik</h3><button class="x" data-a="edit-close" aria-label="Zavrieť">×</button></div>
    <label>Názov</label><input class="tx" id="en" value="${esc(x.n)}" enterkeyhint="done" autocomplete="off">
    <label>Partia</label><select class="tx" id="eg">${GROUPS.map(g=>`<option${g===x.g?' selected':''}>${g}</option>`).join('')}</select>
    <button class="btn pri" style="margin-top:16px" data-a="save-ex" data-id="${x.id}">Uložiť zmeny</button>
    ${S.over[x.id]?`<button class="btn" style="margin-top:8px" data-a="reset-ex" data-id="${x.id}">Vrátiť pôvodný názov a partiu</button>`:''}`;
  }else if(SH.t==='new'){
    body=`<div class="ph"><h3>Vlastný cvik</h3><button class="x" data-a="new-close" aria-label="Zavrieť">×</button></div>
    <label>Názov</label><input class="tx" id="cn" placeholder="napr. Predkopávanie" enterkeyhint="done" autocomplete="off">
    <label>Partia</label><select class="tx" id="cg">${GROUPS.map(g=>`<option>${g}</option>`).join('')}</select>
    <button class="btn pri" style="margin-top:16px" data-a="create-ex">Vytvoriť cvik</button>`;
  }
  el.innerHTML=`<div class="ov${SH.t==='new'||SH.t==='edit'?' top':''}" data-a="ov"><div class="pn">${body}</div></div>`;
}

/* ---------- akcie ---------- */
function addEntry(id){
  const d=S.draft;if(!d||d.entries.some(e=>e.ex===id))return false;
  const l=hist(id,d.id)[0];
  d.entries.push({ex:id,sets:l?l.sets:3,kg:l?l.kg:0,reps:l&&l.reps?l.reps:5});
  persistDraft();return true;
}
function startDraft(name,date){S.draft={date:date||today(),name:name||'',entries:[]};persistDraft()}
const act={
  tab(b){tab=b.dataset.t;confirmK=null;SH=null;render();window.scrollTo(0,0)},
  start(){const n=$('#nn').value.trim(),dt=$('#nd').value||today();startDraft(n,dt);render()},
  repeat(b){const w=S.workouts.find(x=>x.id===b.dataset.id);if(!w)return;S.draft={date:today(),name:w.name,entries:w.entries.map(e=>({...e}))};persistDraft();render();window.scrollTo(0,0)},
  step(b){const e=S.draft.entries[+b.dataset.i],f=b.dataset.f,d=+b.dataset.d;
    e[f]=f==='kg'?Math.max(0,Math.round(((e[f]||0)+d)*10)/10):Math.max(f==='sets'?1:0,Math.round((e[f]||0)+d));
    persistDraft();
    const inp=document.querySelector(`input[data-in="${f}"][data-i="${b.dataset.i}"]`);if(inp)inp.value=(f==='reps'&&!e[f])?'':fmtN(e[f])},
  rm(b){S.draft.entries.splice(+b.dataset.i,1);persistDraft();render()},
  'pick-open'(){SH={t:'pick'};EXF={q:'',g:'Všetko'};render()},
  pick(b){if(addEntry(b.dataset.id)){$('#gridbox').innerHTML=grid('pick',true);const bt=document.querySelector('.ph .btn');if(bt)bt.textContent='Hotovo ('+S.draft.entries.length+')';renderBar();toast('Pridané')}},
  close(){SH=null;confirmK=null;render()},
  ov(b,ev){if(ev.target===b){SH=null;render()}},
  grp(b){EXF.g=b.dataset.g;if(SH&&SH.t==='pick'){renderSheet()}else render()},
  'ex-open'(b){SH={t:'ex',id:b.dataset.id};confirmK=null;renderSheet()},
  'add-from-ex'(b){if(!S.draft)startDraft('',today());addEntry(b.dataset.id);SH=null;tab='train';render();window.scrollTo(0,0);toast('Pridané do tréningu')},
  'new-open'(b){SH={t:'new',back:SH&&SH.t==='pick'?'pick':null};renderSheet()},
  'new-close'(){SH=SH.back?{t:SH.back}:null;render()},
  'edit-open'(b){SH={t:'edit',id:b.dataset.id};renderSheet()},
  'edit-close'(){SH={t:'ex',id:SH.id};renderSheet()},
  'save-ex'(b){const n=$('#en').value.trim();if(!n){toast('Zadaj názov cviku');$('#en').focus();return}
    const id=b.dataset.id,g=$('#eg').value,c=S.custom.find(i=>i.id===id);
    if(c){if(c.n!==n&&!c.a)c.a=c.n;c.n=n;c.g=g}
    else{const o=EX.find(x=>x.id===id);if(o&&o.n===n&&o.g===g)delete S.over[id];else S.over[id]={n,g}}
    persistCustom();SH={t:'ex',id};render();toast('Uložené ✓')},
  'reset-ex'(b){delete S.over[b.dataset.id];persistCustom();SH={t:'ex',id:b.dataset.id};render();toast('Vrátené')},
  export(){
    const blob=new Blob([JSON.stringify({v:1,workouts:S.workouts,custom:S.custom,over:S.over},null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trening-zaloha-'+today()+'.json';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Záloha stiahnutá')},
  import(){const f=$('#imp');if(f)f.click()},
  'cal-nav'(b){let m=CAL.m+(+b.dataset.d),y=CAL.y;if(m<0){m=11;y--}if(m>11){m=0;y++}CAL={y,m};render()},
  'cal-day'(b){selDay=selDay===b.dataset.d?null:b.dataset.d;render()},
  'cal-clear'(){selDay=null;render()},
  'create-ex'(){const n=$('#cn').value.trim();if(!n){toast('Zadaj názov cviku');$('#cn').focus();return}
    const id='c-'+Date.now();S.custom.push({id,n,g:$('#cg').value});persistCustom();
    const back=SH.back;SH=back?{t:back}:null;render();toast('Cvik vytvorený')},
  'del-ex'(b){if(confirmK!=='ex:'+b.dataset.id){confirmK='ex:'+b.dataset.id;renderSheet();return}
    S.custom=S.custom.filter(c=>c.id!==b.dataset.id);persistCustom();confirmK=null;SH=null;render()},
  save(){const d=S.draft;if(!d||!d.entries.length)return;
    const w={id:d.id||'w-'+Date.now(),date:d.date||today(),name:d.name.trim(),entries:d.entries.map(e=>({ex:e.ex,sets:e.sets,kg:e.kg,reps:e.reps||0})),ts:Date.now()};
    const i=S.workouts.findIndex(x=>x.id===w.id);if(i>=0)S.workouts[i]=w;else S.workouts.push(w);
    persistWorkout(w);S.draft=null;persistDraft();tab='hist';confirmK=null;render();window.scrollTo(0,0);toast('Tréning uložený ✓')},
  discard(){if(confirmK!=='discard'){confirmK='discard';renderBar();return}
    S.draft=null;persistDraft();confirmK=null;render()},
  hedit(b){const w=S.workouts.find(x=>x.id===b.dataset.id);if(!w)return;
    S.draft={id:w.id,date:w.date,name:w.name,entries:w.entries.map(e=>({...e}))};persistDraft();tab='train';render();window.scrollTo(0,0)},
  hdel(b){const k='del:'+b.dataset.id;if(confirmK!==k){confirmK=k;render();return}
    S.workouts=S.workouts.filter(w=>w.id!==b.dataset.id);removeWorkout(b.dataset.id);confirmK=null;render()}
};
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const f=act[b.dataset.a];if(!f)return;
  if(b.dataset.a!=='discard'&&b.dataset.a!=='hdel'&&b.dataset.a!=='del-ex'&&confirmK){confirmK=null}
  f(b,ev);
});
document.addEventListener('change',ev=>{
  if(!ev.target||ev.target.id!=='imp'||!ev.target.files[0])return;
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);let n=0;
    (j.workouts||[]).forEach(w=>{if(w&&w.id&&Array.isArray(w.entries)&&!S.workouts.some(x=>x.id===w.id)){S.workouts.push(w);persistWorkout(w);n++}});
    (j.custom||[]).forEach(c=>{if(c&&c.id&&!S.custom.some(x=>x.id===c.id))S.custom.push(c)});
    S.over=Object.assign({},j.over||{},S.over);persistCustom();render();toast('Obnovené: '+n+' tréningov')
  }catch(e){toast('Súbor sa nepodarilo načítať')}};
  r.readAsText(ev.target.files[0]);
});
document.addEventListener('keydown',ev=>{if(ev.key!=='Enter'||!ev.target)return;
  if(ev.target.id==='cn'){ev.preventDefault();act['create-ex']()}
  else if(ev.target.id==='en'){ev.preventDefault();act['save-ex']({dataset:{id:SH.id}})}});
document.addEventListener('input',ev=>{
  const t=ev.target,k=t.dataset&&t.dataset.in;if(!k)return;
  if(k==='exq'){EXF.q=t.value;$('#gridbox').innerHTML=grid(SH&&SH.t==='pick'?'pick':'ex-open',SH&&SH.t==='pick');return}
  const d=S.draft;if(!d)return;
  if(k==='name')d.name=t.value;
  else if(k==='date'){if(t.value)d.date=t.value}
  else{
    const e=d.entries[+t.dataset.i];if(!e)return;
    let v=parseFloat(String(t.value).replace(',','.'));if(!isFinite(v)||v<0)v=0;
    e[k]=(k==='sets'||k==='reps')?Math.round(v):v;
  }
  persistDraft();
});

/* ---------- synchronizacia s uctom (ak je dostupna) ---------- */
(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    const c=db.collection('data/users/'+uid);
    c.onSnapshot(snap=>{
      if(snap.metadata.fromCache)return;
      const ws=[];let cu=null,ov=null,dr=null,hasDr=false;
      snap.docs.forEach(d=>{const v=d.data()||{};
        if(d.id.startsWith('w-'))ws.push(v);
        else if(d.id==='custom'){cu=v.items||[];ov=v.over||{}}
        else if(d.id==='draft'){dr=v.d||null;hasDr=true}});
      if(snap.empty&&(S.workouts.length||S.custom.length)&&!col){
        col=c;backend='db';
        S.workouts.forEach(w=>persistWorkout(w));if(S.custom.length)persistCustom();
        return;
      }
      col=c;backend='db';
      const srv=cu||[],ids=new Set(srv.map(i=>i.id)),loc=S.custom.filter(i=>!ids.has(i.id));
      S.workouts=ws;S.custom=srv.concat(loc);S.over=Object.assign({},S.over,ov||{});if(loc.length)persistCustom();
      if(!draftLoaded){draftLoaded=true;if(hasDr&&dr&&!S.draft)S.draft=dr}
      lsSave();
      const a=document.activeElement;
      if(!(a&&(a.tagName==='INPUT'||a.tagName==='SELECT')))render();
    },err=>console.warn(err));
  }catch(e){console.warn(e)}
})();

if(window.STANDALONE&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
